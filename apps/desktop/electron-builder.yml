appId: com.bpmsoftagent.desktop
productName: BPMSoft Agent
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
icon: build/icon.png
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: false
npmRebuild: false
afterPack: build/afterPack.cjs
mac:
  target: dmg
  category: public.app-category.developer-tools
  # Ad-hoc signature until there is a Developer ID certificate; hardened runtime is only needed for notarization.
  identity: '-'
  hardenedRuntime: false
win:
  target: nsis
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: bpmsoft-agent <noreply@bpmsoft-agent.local>
  synopsis: AI agent for BPMSoft development
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
