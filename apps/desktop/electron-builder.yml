appId: com.bpmsoftagent.desktop
productName: BPMSoft Agent
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: false
npmRebuild: false
afterPack: build/afterPack.cjs
mac:
  target: dmg
  category: public.app-category.developer-tools
  # Ad-hoc signature until there is a Developer ID certificate; hardened runtime is only needed for notarization.
  identity: '-'
  hardenedRuntime: false
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
